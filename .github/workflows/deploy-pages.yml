name: Generate Project Index and Deploy Pages

on:
  push:
    branches: ["main"]
  workflow_dispatch:
  schedule:
    - cron: "0 3 * * *"

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  build-and-deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Build project index
        env:
          GH_TOKEN: ${{ github.token }}
          USERNAME: ${{ github.repository_owner }}
        run: |
          set -euo pipefail
          mkdir -p dist
          cp index.html styles.css app.js dist/
          touch dist/.nojekyll

          repos_json=$(curl --fail --retry 3 --silent --show-error \
            -H "Authorization: Bearer $GH_TOKEN" \
            -H "Accept: application/vnd.github+json" \
            "https://api.github.com/users/$USERNAME/repos?per_page=100&sort=updated")

          jq \
            --arg generated_at "$(date -u +%Y-%m-%dT%H:%M:%SZ)" \
            --arg username "$USERNAME" \
            '{
              generated_at: $generated_at,
              projects: [
                .[]
                | select(.name != ($username + ".github.io"))
                | select(.has_pages == true)
                | {
                    name,
                    description: (.description // "暂无描述。"),
                    language: (.language // "Web"),
                    page_url: ("https://" + $username + ".github.io/" + .name + "/"),
                    html_url,
                    updated_at
                  }
              ]
            }' <<< "$repos_json" > dist/projects.json

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Upload static files
        uses: actions/upload-pages-artifact@v3
        with:
          path: "./dist"

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
